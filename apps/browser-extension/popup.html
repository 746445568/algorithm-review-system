<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OJ Review Companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>OJ Review</h1>
      <p id="summary">Checking secure desktop pairing...</p>

      <form id="pairForm" hidden>
        <label for="pairingCode">Pairing code from OJ Review Desktop</label>
        <input id="pairingCode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" />
        <button id="pairButton" type="submit">Pair extension</button>
      </form>

      <div id="pairedActions" hidden>
        <button id="importButton" type="button">Import current page</button>
        <button id="retryButton" class="secondary" type="button">Retry pending imports</button>
        <button id="showPairFormButton" class="link-button" type="button">Pair again</button>
      </div>

      <p id="queueStatus"></p>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
