name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run Go tests
        run: go test ./...
        working-directory: apps/server

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: apps/desktop-electron
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/desktop-electron
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: apps/desktop-electron

  build:
    needs: [test-go, test-js]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            electron-target: win
          - os: macos-latest
            goos: darwin
            goarch: arm64
            electron-target: mac
          - os: macos-13
            goos: darwin
            goarch: amd64
            electron-target: mac
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            electron-target: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: apps/desktop-electron

      - name: Build Go binary
        run: npm run build:go
        working-directory: apps/desktop-electron
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Build renderer
        run: npm run build:renderer
        working-directory: apps/desktop-electron

      - name: Build Electron package
        run: npx electron-builder --publish=never --${{ matrix.electron-target }}
        working-directory: apps/desktop-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            apps/desktop-electron/dist/*.exe
            apps/desktop-electron/dist/*.dmg
            apps/desktop-electron/dist/*.AppImage
            apps/desktop-electron/dist/*.deb
            apps/desktop-electron/dist/latest*.yml
            apps/desktop-electron/dist/*.blockmap
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}

            See [CHANGELOG.md](./CHANGELOG.md) for details.
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
